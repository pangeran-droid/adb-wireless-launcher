<svg width="760" height="180" viewBox="0 0 760 180" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#34d399"/>
      <stop offset="100%" stop-color="#3b82f6"/>
    </linearGradient>
  </defs>

  <rect width="760" height="180" rx="20" fill="url(#bg)"/>

  <!-- phone icon -->
  <g transform="translate(40,35)">
    <rect x="0" y="0" width="60" height="110" rx="10" fill="none" stroke="url(#accent)" stroke-width="5"/>
    <circle cx="30" cy="95" r="5" fill="url(#accent)"/>
    <rect x="12" y="14" width="36" height="66" rx="3" fill="#0b1220"/>
  </g>

  <!-- wifi arcs -->
  <g transform="translate(118,60)" fill="none" stroke="url(#accent)" stroke-width="5" stroke-linecap="round">
    <path d="M0 35 Q 30 0 60 35"/>
    <path d="M10 45 Q 30 20 50 45"/>
    <circle cx="30" cy="58" r="5" fill="url(#accent)" stroke="none"/>
  </g>

  <!-- title -->
  <text x="195" y="90" font-family="Verdana, Arial, sans-serif" font-size="34" font-weight="bold" fill="#f8fafc">
    ADB Wireless Launcher
  </text>
  <text x="195" y="120" font-family="Verdana, Arial, sans-serif" font-size="16" fill="#94a3b8">
    One command. Wireless ADB + Scrcpy, instantly.
  </text>
</svg>
